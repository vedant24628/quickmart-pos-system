{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Staff — Quick Mart</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/>
          <circle cx="19" cy="21" r="1"/>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
      </div>
      <h1 class="auth-title">Join Quick Mart</h1>
      <p class="auth-subtitle">Register store staff or cashier terminal account</p>
    </div>

    <!-- Flash Messages -->
    {% if messages %}
      <div class="flash-container">
        {% for message in messages %}
          <div class="flash-alert {{ message.tags }}">
            <span>{{ message }}</span>
            <button type="button" class="flash-close-btn">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'auth:register' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Work Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@quickmart.com" required>
      </div>

      <div class="form-group">
        <label for="role" class="form-label">Store Role</label>
        <select id="role" name="role" class="form-control">
          <option value="cashier">Cashier</option>
          <option value="manager">Store Manager</option>
          <option value="admin">Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
        Complete Registration
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'auth:login' %}">Log in here</a>
    </div>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
